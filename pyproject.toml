[project]
name = "local-ai-shell"
version = "0.2.0"
description = "Private, offline plain-English assistant for the Linux terminal, backed by a local Ollama model"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["ai-shell.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# The system prompts are long natural-language strings; wrapping them would change the prompt.
ignore = ["E501"]
